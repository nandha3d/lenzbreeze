<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="lens" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e0f2f1" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#b2dfdb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#80cbc4" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="shine" cx="35%" cy="35%" r="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0e3558" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#f8fafb" rx="24"/>
  <!-- Outer ring -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#00afb0" stroke-width="1.5" opacity="0.15"/>
  <!-- Main lens -->
  <circle cx="200" cy="200" r="120" fill="url(#lens)" filter="url(#shadow)" stroke="#00afb0" stroke-width="1" opacity="0.9"/>
  <!-- Inner ring -->
  <circle cx="200" cy="200" r="90" fill="none" stroke="#00afb0" stroke-width="0.8" opacity="0.12"/>
  <!-- Shine -->
  <circle cx="180" cy="180" r="70" fill="url(#shine)"/>
  <!-- Subtle brand text -->
  <text x="200" y="210" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0e3558" opacity="0.2">LENS</text>
</svg>
